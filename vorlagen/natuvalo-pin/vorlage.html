<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1000px;height:1500px;background:#f4ede4;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.ph{position:absolute;top:0;left:0;width:1000px;height:760px;background:url({IMG}) center/cover}
.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(244,237,228,0) 55%,#f4ede4 100%)}
.card{position:absolute;left:50px;right:50px;top:570px;bottom:110px;background:#fcf8f3;border-radius:22px;box-shadow:0 18px 50px rgba(60,40,20,.18);padding:44px 48px;display:flex;flex-direction:column}
.k{color:#a3342c;font-weight:700;letter-spacing:.32em;text-transform:uppercase;font-size:22px}
h1{font-family:'DM Serif Display',serif;font-weight:400;color:#1f3a2c;font-size:76px;line-height:1.0;margin:18px 0 12px}
.s{color:#4a4a44;font-size:27px;margin-bottom:26px}
ul{list-style:none;display:flex;flex-direction:column;gap:18px}
li{display:flex;align-items:center;gap:20px;font-size:30px;color:#2a2a26;line-height:1.25}
li b{color:#1f3a2c}
.n{flex:0 0 52px;height:52px;border-radius:50%;background:#1f3a2c;color:#fff;font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center}
.dense ul{gap:11px}.dense li{font-size:27px}.dense .n{flex-basis:46px;height:46px;font-size:21px}
.f{position:absolute;bottom:26px;width:100%;text-align:center;color:#6b665e;font-size:20px;letter-spacing:.12em}
</style></head><body class="{DENSE}">
<div class="ph"></div>
<div class="card"><div class="k">{KICKER}</div><h1>{TITLE}</h1><div class="s">{SUB}</div><ul>{ITEMS}</ul></div>
<div class="f">NATUVALO · pinterest.de/natuvalo</div>
</body></html>
